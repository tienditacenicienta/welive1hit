<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ONE HIT — Administración</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font-family:"DM Sans",Arial,sans-serif}button,input,select{font:inherit}.top{background:#090909;color:#fff;padding:22px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.06em;font-size:24px}.brand span{font-weight:400}.top small{color:#aaa;letter-spacing:.14em;font-size:10px}.wrap{max-width:1200px;margin:36px auto;padding:0 22px}.login{max-width:420px;margin:10vh auto;background:white;padding:32px;border:1px solid #ddd;border-radius:14px}.login h1{font-size:28px;margin:0 0 8px}.muted{color:#777}.field{display:flex;flex-direction:column;gap:8px;margin:22px 0}.field input{padding:14px;border:1px solid #bbb;border-radius:7px}.btn{border:0;background:#090909;color:white;padding:13px 18px;font-weight:800;cursor:pointer;border-radius:5px}.btn:disabled{opacity:.5}.login .btn{width:100%}.error{color:#b42318;font-size:13px;margin-top:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.toolbar h1{font-size:32px;margin:0}.toolbar input{padding:12px 14px;border:1px solid #ccc;border-radius:6px;min-width:240px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat,.order{background:white;border:1px solid #e1e1e1;border-radius:10px;padding:18px}.stat small{display:block;color:#777;font-size:11px;letter-spacing:.1em}.stat strong{font-size:28px}.order{margin-bottom:12px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:13px}.order-id{font-weight:900;font-size:17px}.pill{font-size:11px;font-weight:800;padding:6px 9px;border-radius:30px;background:#eee}.pill.paid,.pill.delivered{background:#dcfce7;color:#166534}.pill.pending{background:#fef3c7;color:#92400e}.pill.cancelled,.pill.rejected{background:#fee2e2;color:#991b1b}.meta{display:flex;gap:20px;flex-wrap:wrap;color:#555;font-size:13px;margin:13px 0}.products{width:100%;border-collapse:collapse;font-size:13px}.product-preview{width:64px;height:64px;object-fit:cover;display:block;border-radius:6px;background:#f1f1f1}.product-cell{display:flex;align-items:center;gap:11px;min-width:190px}.product-cell span{font-weight:600}.products th,.products td{text-align:left;padding:9px 8px;border-bottom:1px solid #eee}.products th{font-size:10px;letter-spacing:.1em;color:#777}.order-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px}.order-foot select{padding:9px;border:1px solid #ccc;border-radius:5px}.total{font-weight:900;font-size:18px}.empty{background:#fff;padding:28px;border-radius:10px;color:#777}.hidden{display:none!important}@media(max-width:650px){.stats{grid-template-columns:1fr}.toolbar h1{font-size:26px}.products{font-size:11px}.products th,.products td{padding:8px 4px}.wrap{padding:0 12px}.order{padding:13px}}
</style></head><body>
<header class="top"><div><div class="brand">ONE<span>HIT</span>®</div><small>ADMINISTRACIÓN DE PEDIDOS</small></div><button class="btn hidden" id="logout">CERRAR SESIÓN</button></header>
<main class="wrap"><section class="login" id="login"><h1>Acceso privado.</h1><p class="muted">Ingresa tu contraseña de administración.</p><form id="login-form"><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">INGRESAR ↗</button><p class="error" id="login-error"></p></form></section>
<section id="dashboard" class="hidden"><div class="toolbar"><div><h1>Pedidos</h1><p class="muted">Consulta compras, datos de envío y pagos.</p></div><input id="search" type="search" placeholder="Buscar pedido, celular o producto…"></div><div class="stats"><div class="stat"><small>PEDIDOS</small><strong id="count">0</strong></div><div class="stat"><small>VENTAS PAGADAS</small><strong id="sales">S/ 0.00</strong></div><div class="stat"><small>PENDIENTES</small><strong id="pending">0</strong></div></div><div id="orders"></div></section></main>
<script>
const $=s=>document.querySelector(s);let orders=[];
const money=n=>"S/ "+Number(n||0).toFixed(2);
const statusLabel={paid:"Pagado",pending:"Pendiente",preparing:"En preparación",shipped:"Enviado",delivered:"Entregado",cancelled:"Cancelado"};
async function load(){const r=await fetch("/api/admin-orders",{cache:"no-store"});if(r.status===401){showLogin();return}const d=await r.json();if(!r.ok)throw Error(d.error||"No se pudieron cargar los pedidos.");orders=d.orders||[];render()}
function showLogin(){$("#login").classList.remove("hidden");$("#dashboard").classList.add("hidden");$("#logout").classList.add("hidden")}
function showDashboard(){$("#login").classList.add("hidden");$("#dashboard").classList.remove("hidden");$("#logout").classList.remove("hidden")}
function render(){showDashboard();$("#count").textContent=orders.length;$("#sales").textContent=money(orders.filter(o=>["paid","preparing","shipped","delivered"].includes(o.status)).reduce((s,o)=>s+o.total,0));$("#pending").textContent=orders.filter(o=>o.status==="pending").length;const q=$("#search").value.toLowerCase();const list=orders.filter(o=>[o.short_id,o.reference,o.phone,...o.items.map(i=>i.name)].join(" ").toLowerCase().includes(q));$("#orders").innerHTML=list.length?list.map(o=>`<article class="order"><div class="order-head"><div><div class="order-id">${o.short_id}</div><small class="muted">${new Date(o.created_at+"Z").toLocaleString("es-PE")}</small></div><span class="pill ${o.status}">${statusLabel[o.status]||o.status}</span></div><div class="meta"><span>CELULAR: <b>${o.phone}</b></span><span>ENVÍO: <b>${o.shipping_method}</b> · ${money(o.shipping_cost)}</span></div><table class="products"><thead><tr><th>REFERENCIA</th><th>PRODUCTO</th><th>COLOR</th><th>TALLA</th><th>CANT.</th><th>UNIT.</th></tr></thead><tbody>${o.items.map(i=>`<tr><td><img class="product-preview" src="${o.image}" alt="Referencia visual de ${i.name}" loading="lazy"></td><td><div class="product-cell"><span>${i.name}</span></div></td><td>${i.color}</td><td>${i.size}</td><td>${i.quantity}</td><td>${money(i.unit_price)}</td></tr>`).join("")}</tbody></table><div class="order-foot"><span class="total">TOTAL ${money(o.total)}</span><label>ESTADO <select data-status="${o.reference}">${Object.entries(statusLabel).map(([v,l])=>`<option value="${v}" ${o.status===v?"selected":""}>${l}</option>`).join("")}</select></label></div></article>`).join(""):'<div class="empty">No hay pedidos que coincidan.</div>';document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>updateStatus(s.dataset.status,s.value))}
async function updateStatus(reference,status){const r=await fetch("/api/admin-orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reference,status})});const d=await r.json();if(!r.ok){alert(d.error||"No se pudo actualizar.");return}await load()}
$("#login-form").onsubmit=async e=>{e.preventDefault();$("#login-error").textContent="";const r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#password").value})});const d=await r.json();if(!r.ok){$("#login-error").textContent=d.error||"No se pudo iniciar sesión.";return}$("#password").value="";try{await load()}catch(err){$("#login-error").textContent=err.message;showLogin()}};
$("#logout").onclick=async()=>{await fetch("/api/admin-logout",{method:"POST"});showLogin()};
$("#search").oninput=render;
load().catch(()=>showLogin());
</script></body></html>
